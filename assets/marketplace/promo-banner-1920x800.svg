<?xml version="1.0" encoding="UTF-8"?>
<!--
  Промо-баннер 1920×800. Используется на лендинге, в подборках, для соцсетей (можно
  кадрировать под 1200×630 OG-формат).

  Композиция: слева — слоган и иконка приложения; справа — мокап чата с сообщением
  бота и кнопками голосования.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800"
     role="img" aria-label="Промо-баннер: Согласование в чате">
  <title>Согласовывайте в чате — без писем и БП</title>

  <!-- Градиентный фон -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F6F8"/>
      <stop offset="100%" stop-color="#E5EBF0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#0A2540" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1920" height="800" fill="url(#bg)"/>

  <!-- ЛЕВАЯ ЧАСТЬ — слоган + иконка -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#0A2540">
    <!-- Иконка приложения (упрощённая копия icon-marketplace) -->
    <g transform="translate(120 140)">
      <rect width="120" height="120" rx="24" fill="#2FC7F7"/>
      <polyline points="32,62 54,84 94,40"
                stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <text x="266" y="208" font-size="32" font-weight="600" fill="#5A6B7B">Согласование в чате</text>
    <text x="266" y="244" font-size="20" fill="#7A8B9B">для Битрикс24</text>

    <!-- Слоган -->
    <text x="120" y="400" font-size="84" font-weight="700">Согласовывайте</text>
    <text x="120" y="490" font-size="84" font-weight="700">прямо в чате.</text>

    <!-- Подслоган -->
    <text x="120" y="560" font-size="32" fill="#5A6B7B">Без писем. Без задач. Без БП.</text>

    <!-- Три буллета -->
    <g font-size="22" fill="#37BB72">
      <text x="120" y="640">✓ <tspan fill="#0A2540" font-weight="500">5 секунд на запрос</tspan></text>
      <text x="120" y="678">✓ <tspan fill="#0A2540" font-weight="500">Голосование кнопками в боте</tspan></text>
      <text x="120" y="716">✓ <tspan fill="#0A2540" font-weight="500">Аудит-след в Битрикс24</tspan></text>
    </g>
  </g>

  <!-- ПРАВАЯ ЧАСТЬ — мокап чата -->
  <g transform="translate(1100 100)" filter="url(#cardShadow)">
    <!-- Карточка чата -->
    <rect width="700" height="600" rx="20" fill="#FFFFFF"/>

    <!-- Шапка чата -->
    <rect width="700" height="64" rx="20" fill="#2FC7F7"/>
    <rect y="44" width="700" height="20" fill="#2FC7F7"/>
    <text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20"
          font-weight="600" fill="#FFFFFF">Юридический отдел — закупки</text>

    <!-- Сообщение бота -->
    <g transform="translate(32 100)">
      <!-- Аватар бота (мини) -->
      <circle cx="24" cy="24" r="24" fill="#1FA7D7"/>
      <rect x="11" y="14" width="26" height="22" rx="5" fill="#FFFFFF"/>
      <polyline points="16,26 22,30 32,20" stroke="#37BB72" stroke-width="2.4" fill="none"
                stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Сообщение -->
      <g transform="translate(60 0)" font-family="Arial, Helvetica, sans-serif">
        <text x="0" y="14" font-size="14" fill="#5A6B7B">Бот «Согласование»</text>
        <rect width="580" height="220" rx="14" fill="#F4F6F8"/>
        <text x="20" y="36" font-size="16" font-weight="600" fill="#0A2540">
          Запрос на согласование от Анны Смирновой
        </text>
        <text x="20" y="64" font-size="14" fill="#5A6B7B">
          Договор оказания услуг №2026/03/Ромашка.pdf
        </text>
        <text x="20" y="86" font-size="14" fill="#5A6B7B">
          Прошу проверить и согласовать. Срок: до 30 апреля.
        </text>
        <text x="20" y="118" font-size="13" fill="#7A8B9B">Правило: единогласно (3 из 3)</text>
        <text x="20" y="138" font-size="13" fill="#7A8B9B">Согласовали: 1 · Ожидают: 2</text>

        <!-- Прогресс-бар -->
        <rect x="20" y="150" width="540" height="6" rx="3" fill="#E5EBF0"/>
        <rect x="20" y="150" width="180" height="6" rx="3" fill="#37BB72"/>

        <!-- Кнопки голосования -->
        <g transform="translate(20 178)">
          <rect width="180" height="32" rx="6" fill="#37BB72"/>
          <text x="90" y="21" text-anchor="middle" font-size="14" font-weight="600"
                fill="#FFFFFF">✓ Согласовать</text>

          <g transform="translate(196 0)">
            <rect width="180" height="32" rx="6" fill="#FFFFFF" stroke="#FF5752" stroke-width="1.5"/>
            <text x="90" y="21" text-anchor="middle" font-size="14" font-weight="600"
                  fill="#FF5752">✕ Отклонить</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Свежая отметка «Игорь Петров согласовал» -->
    <g transform="translate(32 360)">
      <circle cx="20" cy="20" r="20" fill="#37BB72"/>
      <text x="20" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
            font-size="18" font-weight="700" fill="#FFFFFF">ИП</text>
      <g transform="translate(56 8)" font-family="Arial, Helvetica, sans-serif">
        <text x="0" y="14" font-size="14" font-weight="600" fill="#0A2540">Игорь Петров</text>
        <text x="0" y="34" font-size="13" fill="#37BB72">✓ согласовал · 2 минуты назад</text>
      </g>
    </g>

    <!-- Поле ввода с иконкой приложения -->
    <g transform="translate(32 520)">
      <rect width="636" height="56" rx="12" fill="#F4F6F8"/>
      <text x="20" y="36" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7A8B9B">
        Напишите сообщение…
      </text>
      <!-- Иконка приложения над полем (метафора) -->
      <g transform="translate(548 12)">
        <rect width="32" height="32" rx="6" fill="#2FC7F7"/>
        <polyline points="9,18 14,23 24,12"
                  stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"
                  stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>
</svg>
