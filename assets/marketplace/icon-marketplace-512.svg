<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Согласование в чате — иконка приложения">
  <title>Согласование в чате</title>
  <desc>Чат-баббл с зелёной галочкой согласования. Цвета по бренд-палитре visuals-brief.md.</desc>

  <!-- Фон карточки. По регламенту Битрикс24 Маркетплейса фон НЕ прозрачный. -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#F4F6F8"/>

  <!-- Подложка-«падинг» под чат-бабблом, чуть темнее фона, для глубины -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="#FFFFFF"/>

  <!-- Чат-баббл (основной элемент) -->
  <!-- Скруглённый прямоугольник с «хвостиком» в нижнем левом углу -->
  <g>
    <path d="
        M 128 144
        L 384 144
        Q 416 144 416 176
        L 416 320
        Q 416 352 384 352
        L 220 352
        L 168 400
        L 168 352
        L 128 352
        Q 96 352 96 320
        L 96 176
        Q 96 144 128 144
        Z"
      fill="#2FC7F7"/>
  </g>

  <!-- Галочка согласования на чат-баббле -->
  <g stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="170,250 230,310 360,180"/>
  </g>

  <!-- Микро-индикатор «голосуют»: 3 точки под бабблом -->
  <g fill="#37BB72">
    <circle cx="232" cy="430" r="10"/>
    <circle cx="266" cy="430" r="10"/>
    <circle cx="300" cy="430" r="10"/>
  </g>
</svg>
