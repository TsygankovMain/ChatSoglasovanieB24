<?xml version="1.0" encoding="UTF-8"?>
<!--
  Иконка для placement IM_TEXTAREA.
  По регламенту Битрикс24 (https://apidocs.bitrix24.ru/api-reference/chats/outdated/icon.html):
    - Холст 108×66, прозрачный фон.
    - Левая половина (54×66) — inactive, цвет #B3B7BC.
    - Правая половина (54×66) — active, цвет #2FC7F7.
    - Основной элемент в каждой зоне ≤ 45×32, отцентрирован.
  При загрузке через imbot.app.update этот SVG нужно конвертировать в PNG и закодировать в base64,
  передать как ICON_FILE.

  Визуально: тот же чат-баббл с галочкой, что и в иконке Маркетплейса, но в одноцветной
  пиктографике (заливка серая/голубая для inactive/active).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 66" width="108" height="66"
     shape-rendering="geometricPrecision" role="img" aria-label="Кнопка приложения 'Согласование в чате' над полем ввода">
  <title>Согласование в чате (placement IM_TEXTAREA)</title>

  <!-- ЛЕВАЯ ПОЛОВИНА — inactive (#B3B7BC) -->
  <!-- Основной элемент 45×32, центр в (27, 33) -->
  <g transform="translate(27 33)" fill="none">
    <!-- Чат-баббл, скруглённый, с хвостиком внизу слева -->
    <g fill="#B3B7BC">
      <path d="
          M -18 -14
          Q -22.5 -14 -22.5 -9.5
          L -22.5 6
          Q -22.5 10.5 -18 10.5
          L -10 10.5
          L -10 16
          L -2 10.5
          L 18 10.5
          Q 22.5 10.5 22.5 6
          L 22.5 -9.5
          Q 22.5 -14 18 -14
          Z" />
    </g>
    <!-- Галочка белым -->
    <polyline points="-10,-1 -3,6 11,-9"
              stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ПРАВАЯ ПОЛОВИНА — active (#2FC7F7) -->
  <g transform="translate(81 33)" fill="none">
    <g fill="#2FC7F7">
      <path d="
          M -18 -14
          Q -22.5 -14 -22.5 -9.5
          L -22.5 6
          Q -22.5 10.5 -18 10.5
          L -10 10.5
          L -10 16
          L -2 10.5
          L 18 10.5
          Q 22.5 10.5 22.5 6
          L 22.5 -9.5
          Q 22.5 -14 18 -14
          Z" />
    </g>
    <polyline points="-10,-1 -3,6 11,-9"
              stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
