services:
  # (~) Frontend
  frontend:
    profiles: [ "frontend" ]
    container_name: ChatApproveFrontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-dev}
    env_file: .env
    environment:
      NUXT_PUBLIC_APP_URL: ${VIRTUAL_HOST}
      NUXT_PUBLIC_API_URL: ${VIRTUAL_HOST}
      HTTP: frontend:3000
    expose:
      - '3000'
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
    networks:
      - internal-net

  # (~) Cloudpub - for frontend
  cloudpub:
    profiles: ["cloudpub"]
    container_name: ChatApproveCloudpub
    # On Apple Silicon set CLOUDPUB_IMAGE=cloudpub/cloudpub:latest-arm64 in .env
    image: ${CLOUDPUB_IMAGE:-cloudpub/cloudpub:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      TOKEN: ${CLOUDPUB_TOKEN}
      HTTP: frontend:3000
    command: run
    depends_on:
      - frontend
    volumes:
      - cloudpub-config:/home/cloudpub
    networks:
      - internal-net

  # (~) API server
  api-python:
    profiles: ["python"]
    container_name: ChatApproveApiPython
    build:
      context: ./backends/python
      dockerfile: api/Dockerfile
      target: ${BUILD_TARGET:-dev}
    env_file: .env
    environment:
      PORT: 8000
      NUXT_PUBLIC_API_URL: ${VIRTUAL_HOST}
    expose:
      - "8000"
    ports:
      - "8002:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./backends/python/api:/var/www/api
      - ./logs/python:/var/log/python
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  cloudpub-config:
